name: Gold signal
on:
  schedule:
    - cron: "7 * * * 1-5"
  workflow_dispatch:
    inputs:
      force:
        description: "Test: signal bo'lmasa ham Telegramga yubor"
        default: "true"
jobs:
  signal:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -q yfinance
      - name: Signal
        shell: bash
        run: python -m goldbot signal data/gold_1h.csv --refresh | tee out.txt
      - name: Telegram
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          FORCE: ${{ github.event.inputs.force }}
        run: |
          c=$(grep -oE "[0-9]{4}-[0-9]{2}-[0-9]{2} [0-9]{2}:[0-9]{2}:[0-9]{2} UTC" out.txt | head -1 | sed 's/ UTC//')
          age=$(( $(date -u +%s) - $(date -ud "$c" +%s) ))
          if [ "$FORCE" = "true" ] || { grep -qE "^SIGNAL: (BUY|SELL)" out.txt && [ "$age" -le 8000 ]; }; then
            curl -sS -f "https://api.telegram.org/bot${TOKEN}/sendMessage" --data-urlencode "chat_id=${CHAT}" --data-urlencode "text@out.txt"
          else
            echo "Signal yo'q yoki ma'lumot eski, yuborilmadi."
          fi
